[theme]
base = "dark"
primaryColor = "#0a84ff"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#ffffff"
borderColor = "#38383a"
font = "-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, system-ui, sans-serif"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
