[theme]
base = "dark"
primaryColor = "#0f766e"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#171a1f"
textColor = "#e8eaed"
borderColor = "#262a31"
font = "-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, system-ui, sans-serif"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
